<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="robots" content="noindex, nofollow">
  <title>Unggah Kenangan — Pemuda Hijrah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-slot"></div>

  <main class="container narrow">
    <a class="back" href="footage.html">← Kembali ke Footage</a>
    <h1>Unggah kenangan</h1>
    <p class="muted">Bagikan satu foto beserta ceritanya.</p>

    <form id="upload-form" class="panel" novalidate>
      <div class="field">
        <label for="file">Foto</label>
        <input id="file" type="file" accept="image/*" required>
        <span class="hint">Dari galeri HP atau komputer. Foto otomatis diperkecil dan data lokasi (GPS) di dalamnya dihapus.</span>
        <div id="preview" class="preview" hidden><img id="preview-img" alt="Pratinjau foto"></div>
      </div>

      <div class="field">
        <label for="title">Judul <span class="muted">(opsional)</span></label>
        <input id="title" type="text" maxlength="100" placeholder="Contoh: Camping di Pantai">
      </div>

      <div class="field">
        <label for="caption">Caption / cerita <span class="muted">(opsional)</span></label>
        <textarea id="caption" maxlength="1000" placeholder="Ceritakan momen ini…"></textarea>
      </div>

      <div class="field">
        <label for="taken">Tanggal kejadian <span class="muted">(opsional)</span></label>
        <input id="taken" type="date">
      </div>

      <div class="field">
        <label class="check" for="consent">
          <input id="consent" type="checkbox">
          <span>Saya sudah memastikan teman yang ada di foto ini setuju fotonya dibagikan di sini.</span>
        </label>
      </div>

      <p id="form-msg" class="form-error" role="alert"></p>
      <button id="submit" class="btn btn-block" type="submit">Unggah</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
