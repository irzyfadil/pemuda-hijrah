<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="robots" content="noindex, nofollow">
  <title>Masuk — Pemuda Hijrah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-brand">
      <a class="brand-mark" href="index.html" aria-label="Ke halaman utama" style="text-decoration:none">PH</a>
      <h1>Pemuda Hijrah</h1>
      <p>Galeri kenangan khusus anggota.</p>
    </div>

    <div class="panel">
      <div class="tabs" role="tablist">
        <button id="tab-login" class="tab" role="tab" aria-selected="true" type="button">Masuk</button>
        <button id="tab-signup" class="tab" role="tab" aria-selected="false" type="button">Daftar</button>
      </div>

      <form id="form-login" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label for="login-password">Kata sandi</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-msg" class="form-error" role="alert"></p>
        <button id="login-btn" class="btn btn-block" type="submit">Masuk</button>
      </form>

      <form id="form-signup" novalidate hidden>
        <div class="field">
          <label for="su-name">Nama panggilan</label>
          <input id="su-name" type="text" autocomplete="nickname" maxlength="30" required>
          <span class="hint">Nama ini tampil di setiap foto yang kamu unggah (2–30 huruf).</span>
        </div>
        <div class="field">
          <label for="su-email">Email</label>
          <input id="su-email" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label for="su-password">Kata sandi</label>
          <input id="su-password" type="password" autocomplete="new-password" minlength="8" required>
          <span class="hint">Minimal 8 karakter.</span>
        </div>
        <div class="field">
          <label for="su-code">Kode undangan</label>
          <input id="su-code" type="text" autocomplete="off" autocapitalize="off" required>
          <span class="hint">Tanyakan kode ini kepada admin grup.</span>
        </div>
        <p id="signup-msg" class="form-error" role="alert"></p>
        <button id="signup-btn" class="btn btn-block" type="submit">Buat akun</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
