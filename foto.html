<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="robots" content="noindex, nofollow">
  <title>Kenangan — Pemuda Hijrah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-slot"></div>

  <main class="container narrow">
    <a class="back" href="footage.html">← Kembali ke Footage</a>
    <div id="status"></div>

    <article id="detail" hidden>
      <img id="photo" class="photo-full" alt="">
      <div id="view" class="meta">
        <h1 id="title"></h1>
        <p id="byline" class="muted"></p>
        <p id="caption" class="caption"></p>
        <div id="actions" class="actions" hidden>
          <button id="btn-edit" class="btn btn-ghost" type="button" hidden>Edit</button>
          <button id="btn-delete" class="btn btn-danger" type="button" hidden>Hapus</button>
        </div>
      </div>

      <form id="edit-form" class="panel" hidden novalidate>
        <div class="field">
          <label for="e-title">Judul</label>
          <input id="e-title" type="text" maxlength="100">
        </div>
        <div class="field">
          <label for="e-caption">Caption / cerita</label>
          <textarea id="e-caption" maxlength="1000"></textarea>
        </div>
        <div class="field">
          <label for="e-taken">Tanggal kejadian</label>
          <input id="e-taken" type="date">
        </div>
        <p id="edit-msg" class="form-error" role="alert"></p>
        <div class="actions">
          <button id="save" class="btn" type="submit">Simpan</button>
          <button id="cancel" class="btn btn-ghost" type="button">Batal</button>
        </div>
      </form>
    </article>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Hapus kenangan ini?</h2>
    <p class="muted">Foto dan ceritanya akan dihapus permanen dan tidak bisa dikembalikan.</p>
    <div class="actions">
      <button id="confirm-cancel" class="btn btn-ghost" type="button">Batal</button>
      <button id="confirm-ok" class="btn btn-danger" type="button">Ya, hapus</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
